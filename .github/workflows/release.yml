name: Release

# Runs after a merge to main. Pushes the images, then points staging at them in Git.
# Argo CD sees that commit and deploys it. This workflow never talks to the cluster.
on:
  push:
    branches: [main]
    # Only when app code (or this file) changed. Chart-only changes need no new images:
    # Argo CD deploys them straight from main.
    paths:
      - "apps/**"
      - ".github/workflows/release.yml"
  # A "Run workflow" button in the Actions tab, for re-running a release by hand
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in order. A newer merge waits instead of racing this one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    name: Push image (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to GitHub Container Registry with the workflow's own token
      packages: write
    strategy:
      matrix:
        app: [web, api, worker]
    steps:
      - uses: actions/checkout@v7

      # QEMU lets this x86 runner build ARM images too, so the same image runs on
      # your Apple Silicon kind cluster and on an x86 or ARM cloud VM
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          # The commit SHA is the only tag. No "latest": every deploy names exact code.
          tags: ghcr.io/${{ github.repository_owner }}/flashcards-${{ matrix.app }}:${{ github.sha }}
          # Links the package to this repo on GitHub, and records which commit built it
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.app }}

  promote-staging:
    name: Promote to staging
    needs: images
    runs-on: ubuntu-latest
    # The DEPLOY_KEY secret lives in this environment, and the environment only
    # allows the main branch, so a workflow on any other branch can't read it
    environment:
      name: staging
      url: http://staging.localhost:8080
    steps:
      - uses: actions/checkout@v7
        with:
          # Latest main, not the commit that triggered this run, so the push is a fast-forward
          ref: main
          # Push with the deploy key: it is on the ruleset's bypass list, GITHUB_TOKEN is not
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Point staging at the new images
        env:
          TAG: ${{ github.sha }}
          FILE: deploy/helm/flashcards/values-staging.yaml
        run: |
          sed -i -E "s/^  tag: .*/  tag: ${TAG}/" "$FILE"
          test "$(yq '.image.tag' "$FILE")" = "$TAG"
          git diff

      - name: Commit and push to main
        env:
          TAG: ${{ github.sha }}
        run: |
          git config user.name "flashcards-deploy-bot"
          git config user.email "flashcards-deploy-bot@users.noreply.github.com"
          git add deploy/helm/flashcards/values-staging.yaml
          if git diff --cached --quiet; then
            echo "Staging already runs $TAG"
            exit 0
          fi
          git commit -m "Deploy ${TAG:0:7} to staging [skip ci]" -m "Images built from $TAG by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved). Rebasing and retrying, attempt $attempt"
            git pull --rebase origin main
          done
          exit 1
