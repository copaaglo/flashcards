# Shared settings for api + worker, reused with a YAML anchor so they never drift apart
x-app-env: &app-env
  DATABASE_URL: postgresql://flashcards:flashcards@postgres:5432/flashcards
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: uploads
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

services:
  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  worker:
    build: ./apps/worker
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flashcards
      POSTGRES_PASSWORD: flashcards
      POSTGRES_DB: flashcards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcards"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible storage for local dev (stands in for AWS S3)
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  s3data: