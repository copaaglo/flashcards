# Settings for the Traefik ingress controller on the local kind cluster.
# kind has no cloud load balancer, so expose Traefik on a fixed NodePort
# that kind-config.yaml maps to localhost:8080.
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    expose:
      default: false
providers:
  kubernetesIngress:
    # Write 127.0.0.1 into each Ingress's status, since that's where kind serves it.
    # Argo CD only marks an Ingress Healthy once its status has an address, and a
    # NodePort Service on kind never gives Traefik one to copy.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 127.0.0.1
